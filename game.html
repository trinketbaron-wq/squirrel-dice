<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--wood:#6d3f22;--wood2:#3a2112;--cream:#efd0a0;--ink:#2c190c;--green:#21a245;--gold:#e9bd65}
*{box-sizing:border-box}
html,body{margin:0;background:#07140d;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit}button{touch-action:manipulation}
#app{max-width:780px;margin:auto;padding:4px;background:linear-gradient(#0c2416,#06110b)}
.top{display:grid;grid-template-columns:1.15fr .8fr 1fr;gap:4px;align-items:center}
.brand{height:58px;border-radius:13px;padding:7px 9px;background:linear-gradient(145deg,#7a4826,#4b2b17);border:1px solid #ffffff24;display:flex;align-items:center;gap:7px}
.brand .sq{font-size:30px}.brand b{font-size:12px;line-height:1.02}.brand small{font-size:7px;color:#f4d6a5;font-weight:900}
.room{background:#24342d;border-radius:12px;text-align:center;padding:5px 3px;font-size:10px;font-weight:900}.room .turn{display:block;color:#63ff72;margin-top:2px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:3px}.player{border:2px solid #52d96a;background:#154928;border-radius:11px;text-align:center;padding:3px;font-size:8px}.player.friend{background:#173c63;border-color:#48a6ff}.player strong{font-size:12px}
.connect{margin-top:4px;background:#111b16;padding:4px;border-radius:10px;display:grid;grid-template-columns:1fr auto auto;gap:3px}
.connect input{min-width:0;background:#0a1710;border:1px solid #ffffff1c;color:white;border-radius:7px;padding:5px;font-size:11px}
.connect button{border:0;border-radius:7px;padding:5px 7px;background:#e1bd6c;color:#2c1e0d;font-size:9px;font-weight:900}.connect .alt{background:#d8e8d8}

.gameScene{margin-top:4px;border-radius:16px;overflow:hidden;border:3px solid #774526;box-shadow:0 8px 20px #0008;background:#10251a}
.sceneHead{height:25px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:9px;font-weight:1000;background:#1b2b20}
.sceneWrap{position:relative;height:355px}
#sceneCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scoreHint{position:absolute;z-index:4;left:50%;top:8px;transform:translateX(-50%);background:#132018dc;border:1px solid #ffffff24;border-radius:999px;padding:5px 10px;font-size:9px;font-weight:1000}
.rollValues{position:absolute;z-index:4;left:4%;right:4%;bottom:39px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rollValues div{text-align:center;background:#0e1712d8;border:1px solid #ffffff22;border-radius:8px;padding:3px 0;font-size:8px;font-weight:1000}
.holds{position:absolute;z-index:4;left:4%;right:4%;bottom:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.holds button{border:1px solid #776b5c;border-radius:8px;background:#211e1a;color:white;padding:4px 1px;font-size:8px;font-weight:900}.holds button.held{background:#3e5b34;color:#ffe9a1;border-color:#d6b65d}

.score{margin-top:4px;border:3px solid #744221;border-radius:15px;background:linear-gradient(#e9c994,#d8aa70);padding:4px;color:var(--ink)}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.sec{border:1px solid #986e49;border-radius:8px;overflow:hidden;background:#efd2a5}
.sh,.sr,.tot{display:grid;grid-template-columns:1fr 42px}.sh{background:#754220;color:#ffe9c6;font-size:8px;font-weight:1000;padding:3px 4px}
.sr{min-height:23px;border-top:1px solid #b98f67}.sr button{border:0;background:transparent;text-align:left;color:#321d0d;font-size:8.5px;padding:3px 5px;cursor:pointer}.sr .v{display:grid;place-items:center;border-left:1px solid #b98f67;font-size:8.5px;font-weight:900}
.sr.available{background:#d4e8b9;box-shadow:inset 0 0 0 2px #7cb35a}.sr.available button{font-weight:1000;color:#18350e}.sr.used{opacity:.75}
.tot{background:#ca9961;padding:3px 4px;font-size:8px;font-weight:1000}.tot span:last-child{text-align:center}
.rollbar{display:grid;grid-template-columns:1fr 74px;gap:4px;margin-top:4px}.roll{min-height:49px;border:0;border-radius:13px;background:linear-gradient(#4fba5b,#187e2c);color:white;font-size:18px;font-weight:1000;text-shadow:0 2px 2px #0005;box-shadow:0 4px 0 #0b5519}.roll small{display:block;font-size:9px}.roll:disabled{opacity:.5;box-shadow:none}.raid{border:0;border-radius:11px;background:#2c2017;color:#ffe8ba;font-size:8px;font-weight:900}
.info{margin-top:4px;background:#17130f;border-radius:9px;padding:5px 6px;display:flex;justify-content:space-between;gap:4px;font-size:8px;color:#ead7ba}.info button{border:1px solid #5a554f;background:#2b2926;color:#ddd;border-radius:7px;font-size:8px}
.toast{position:fixed;z-index:1000;left:50%;top:12%;transform:translateX(-50%);display:none;background:#f1d09d;color:#3c230e;border:3px solid #754323;border-radius:12px;padding:7px 11px;font-weight:1000;font-size:13px;box-shadow:0 8px 20px #0007}.toast.show{display:block}
@media(max-width:520px){
 #app{padding:3px}.brand{height:49px;padding:4px}.brand .sq{font-size:24px}.brand b{font-size:10px}.room{font-size:8px;padding:4px}.player strong{font-size:10px}
 .connect{grid-template-columns:1fr auto;gap:3px;padding:3px}.connect .alt{grid-column:2}.connect input{font-size:9px}.connect button{font-size:8px}
 .sceneWrap{height:315px}.scoreHint{font-size:8px}.rollValues div,.holds button{font-size:7px}
 .sr{min-height:21px}.sr button,.sr .v{font-size:8px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand"><div class="sq">🐿️</div><div><b>SQUIRREL DICE<br>SHOWDOWN</b><small>ROLL • SCORE • GO NUTS</small></div></div>
    <div class="room"><div id="roomLabel">Room: —</div><span class="turn" id="turnLabel">Start Game</span></div>
    <div class="players"><div class="player">You <strong id="youScore">0</strong></div><div class="player friend">Friend <strong id="friendScore">0</strong></div></div>
  </div>
  <div class="connect">
    <input id="name" value="Player 1" maxlength="18">
    <button id="localBtn">Pass & Play</button><button class="alt" id="hostBtn">Create Room</button>
    <input id="roomInput" placeholder="Room code" maxlength="18"><button id="joinBtn">Join</button>
  </div>

  <section class="gameScene">
    <div class="sceneHead"><span>🌲 LIVE WOODLAND</span><span>🐿️ GOOD ROLLS • HAPPY SQUIRRELS</span><span>💧</span></div>
    <div class="sceneWrap">
      <canvas id="sceneCanvas"></canvas>
      <div class="scoreHint">TOP FACE = SCORE</div>
      <div class="rollValues" id="rollValues"></div>
      <div class="holds" id="holds"></div>
    </div>
  </section>

  <section class="score">
    <div class="sections">
      <div class="sec"><div class="sh"><span>Upper Section</span><span>Score</span></div><div id="upperRows"></div><div class="tot"><span>Upper Total</span><span id="upperTotal">0</span></div></div>
      <div class="sec"><div class="sh"><span>Lower Section</span><span>Score</span></div><div id="lowerRows"></div><div class="tot"><span>Grand Total</span><span id="grandTotal">0</span></div></div>
    </div>
    <div class="rollbar"><button class="roll" id="rollBtn" disabled>🎲 ROLL DICE<small id="rollSub">3 ROLLS LEFT</small></button><button class="raid" id="raidBtn" disabled>🐿️<br>ACORN RAID</button></div>
    <div class="info"><span id="status">Choose Pass & Play, Create Room, or Join.</span><button id="newBtn">New Game</button></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script type="module">
const upper=[["Ones","ones"],["Twos","twos"],["Threes","threes"],["Fours","fours"],["Fives","fives"],["Sixes","sixes"]];
const lower=[["3 of a Kind","three"],["4 of a Kind","four"],["Full House","full"],["Small Straight","small"],["Large Straight","large"],["Yahtzee","yahtzee"],["Chance","chance"]];
const all=[...upper,...lower], $=id=>document.getElementById(id);
const blank=()=>({players:["Player 1","Player 2"],turn:0,rolls:0,dice:[1,1,1,1,1],held:[false,false,false,false,false],scores:[{},{}],started:false,room:"—"});
let state=blank(),mode="none",myIndex=0,peer=null,conn=null;
let THREE,renderer,scene,camera,diceMeshes=[],trees=[],waterMat,waterTex,squirrel,clock,animating=false,runActive=false,runT=0;

function canAct(){return state.started&&(mode==="local"||(mode==="online"&&state.turn===myIndex&&conn&&conn.open))}
function counts(){const c=[0,0,0,0,0,0,0];state.dice.forEach(d=>c[d]++);return c}
function scoreFor(k){
 const c=counts(),sum=state.dice.reduce((a,b)=>a+b,0),u=[...new Set(state.dice)].sort((a,b)=>a-b).join(""),up=["ones","twos","threes","fours","fives","sixes"];
 if(up.includes(k)){const n=up.indexOf(k)+1;return c[n]*n}
 if(k==="three")return c.some(x=>x>=3)?sum:0;
 if(k==="four")return c.some(x=>x>=4)?sum:0;
 if(k==="full")return c.includes(3)&&c.includes(2)?25:0;
 if(k==="small")return /1234|2345|3456/.test(u)?30:0;
 if(k==="large")return u==="12345"||u==="23456"?40:0;
 if(k==="yahtzee")return c.includes(5)?50:0;
 return sum
}
function total(p){return Object.values(state.scores[p]).reduce((a,b)=>a+b,0)}
function upTotal(p){return upper.reduce((s,[,k])=>s+(state.scores[p][k]||0),0)}

function makePipTexture(value){
 const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
 x.fillStyle="#fffaf0";x.fillRect(0,0,256,256);
 const pos={1:[[128,128]],2:[[70,70],[186,186]],3:[[70,70],[128,128],[186,186]],4:[[70,70],[186,70],[70,186],[186,186]],5:[[70,70],[186,70],[128,128],[70,186],[186,186]],6:[[70,58],[186,58],[70,128],[186,128],[70,198],[186,198]]}[value];
 x.fillStyle="#15110d";for(const [px,py] of pos){x.beginPath();x.arc(px,py,22,0,Math.PI*2);x.fill()}
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t
}
function resultQuaternion(v){
 const q=new THREE.Quaternion(),X=new THREE.Vector3(1,0,0),Z=new THREE.Vector3(0,0,1);
 if(v===1)return q;
 if(v===6)return q.setFromAxisAngle(X,Math.PI);
 if(v===2)return q.setFromAxisAngle(X,-Math.PI/2);
 if(v===5)return q.setFromAxisAngle(X,Math.PI/2);
 if(v===3)return q.setFromAxisAngle(Z,Math.PI/2);
 return q.setFromAxisAngle(Z,-Math.PI/2)
}
function makeTree(x,z,s=1){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14*s,.18*s,1.4*s,8),new THREE.MeshStandardMaterial({color:0x5b321b,roughness:1}));
 trunk.position.y=.7*s;g.add(trunk);
 const mat=new THREE.MeshStandardMaterial({color:0x2f6a37,roughness:.85});
 for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((.65-.11*i)*s,1.2*s,10),mat);crown.position.y=(1.2+i*.55)*s;g.add(crown)}
 g.position.set(x,-1.05,z);scene.add(g);trees.push({g,base:g.rotation.z,phase:Math.random()*6.28});return g
}
function makeSquirrel(){
 const g=new THREE.Group();
 const fur=new THREE.MeshStandardMaterial({color:0xb95b22,roughness:.78});
 const cream=new THREE.MeshStandardMaterial({color:0xf0c79a,roughness:.8});
 const dark=new THREE.MeshStandardMaterial({color:0x24150e,roughness:.7});
 const body=new THREE.Mesh(new THREE.SphereGeometry(.55,20,16),fur);body.scale.set(.9,1.15,.75);body.position.y=.55;g.add(body);
 const belly=new THREE.Mesh(new THREE.SphereGeometry(.38,18,14),cream);belly.scale.set(.75,1,.25);belly.position.set(0,.5,.45);g.add(belly);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.42,20,16),fur);head.position.set(0,1.25,.05);g.add(head);
 const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),cream);muzzle.scale.set(1,.7,.7);muzzle.position.set(0,1.15,.34);g.add(muzzle);
 for(const sx of [-1,1]){
   const ear=new THREE.Mesh(new THREE.ConeGeometry(.14,.36,8),fur);ear.position.set(.22*sx,1.62,0);ear.rotation.z=-sx*.18;g.add(ear);
   const eye=new THREE.Mesh(new THREE.SphereGeometry(.055,12,10),dark);eye.position.set(.16*sx,1.33,.38);g.add(eye);
 }
 const nose=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),dark);nose.position.set(0,1.12,.52);g.add(nose);
 const tail=new THREE.Mesh(new THREE.TorusGeometry(.48,.18,12,30,Math.PI*1.45),fur);tail.position.set(-.47,.83,-.18);tail.rotation.set(0.2,1.3,.35);g.add(tail);g.userData.tail=tail;
 const legs=[];
 for(const sx of [-1,1]){
   const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.10,.42,6,10),fur);leg.position.set(.22*sx,.1,.05);leg.rotation.z=.15*sx;g.add(leg);legs.push(leg)
   const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.08,.36,6,10),fur);arm.position.set(.38*sx,.78,.17);arm.rotation.z=.75*sx;g.add(arm);legs.push(arm)
 }
 g.userData.limbs=legs;g.scale.setScalar(.7);g.position.set(-6,-.75,1.1);scene.add(g);return g
}
function makeWaterTexture(){
 const c=document.createElement("canvas");c.width=128;c.height=256;const x=c.getContext("2d");
 const gr=x.createLinearGradient(0,0,0,256);gr.addColorStop(0,"#b9f3ff");gr.addColorStop(.4,"#68cce7");gr.addColorStop(1,"#2e8fb3");x.fillStyle=gr;x.fillRect(0,0,128,256);
 x.globalAlpha=.55;x.strokeStyle="#fff";x.lineWidth=5;
 for(let i=0;i<18;i++){x.beginPath();x.moveTo(Math.random()*128,Math.random()*256);x.lineTo(Math.random()*128,Math.random()*256+40);x.stroke()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.3,2.5);return t
}
async function init3D(){
 THREE=await import("https://cdn.jsdelivr.net/npm/three@0.168.0/+esm");
 const {RoundedBoxGeometry}=await import("https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm");
 const canvas=$("sceneCanvas");renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene=new THREE.Scene();scene.fog=new THREE.Fog(0x8fc5b4,11,25);
 camera=new THREE.PerspectiveCamera(33,1,.1,100);camera.position.set(0,7.5,12.8);camera.lookAt(0,.1,0);
 scene.add(new THREE.HemisphereLight(0xe9f6ff,0x5b351c,2.2));
 const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(-4,8,5);key.castShadow=true;scene.add(key);
 const rim=new THREE.DirectionalLight(0xffc36a,1.2);rim.position.set(6,3,-4);scene.add(rim);

 // Background ground and river
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(24,18),new THREE.MeshStandardMaterial({color:0x355a33,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.set(0,-1.06,-4);scene.add(ground);
 const riverMat=new THREE.MeshStandardMaterial({color:0x318cac,roughness:.3,metalness:.05,transparent:true,opacity:.8});
 const river=new THREE.Mesh(new THREE.PlaneGeometry(6,11),riverMat);river.rotation.x=-Math.PI/2;river.position.set(0,-.99,-7);scene.add(river);

 // Waterfall
 waterTex=makeWaterTexture();waterMat=new THREE.MeshStandardMaterial({map:waterTex,transparent:true,opacity:.88,roughness:.15,side:THREE.DoubleSide});
 const fall=new THREE.Mesh(new THREE.PlaneGeometry(2.6,5.7),waterMat);fall.position.set(0,2.4,-8.7);scene.add(fall);
 const pool=new THREE.Mesh(new THREE.CircleGeometry(2.7,40),new THREE.MeshStandardMaterial({color:0x3fa8c9,transparent:true,opacity:.75,roughness:.25}));pool.rotation.x=-Math.PI/2;pool.position.set(0,-.92,-6.2);scene.add(pool);

 // Trees
 [[-6,-7,1.2],[-4.8,-9,1],[-3,-8,1.4],[3.4,-8,1.3],[5,-9,1],[6.3,-7,1.2],[-7,-4,1],[7,-4,1]].forEach(a=>makeTree(...a));

 // Stump/table
 const top=new THREE.Mesh(new THREE.CylinderGeometry(5.8,6.2,.65,64),new THREE.MeshStandardMaterial({color:0x8a552f,roughness:.82}));
 top.position.y=-.55;top.receiveShadow=true;top.castShadow=true;scene.add(top);

 // Dice
 const mats=[3,4,1,6,2,5].map(v=>new THREE.MeshStandardMaterial({map:makePipTexture(v),roughness:.25,metalness:.02}));
 for(let i=0;i<5;i++){
   const mesh=new THREE.Mesh(new RoundedBoxGeometry(1.38,1.38,1.38,8,.18),mats);
   mesh.castShadow=true;mesh.receiveShadow=true;mesh.position.set((i-2)*1.72,.35,.4);scene.add(mesh);diceMeshes.push(mesh)
 }
 squirrel=makeSquirrel();clock=new THREE.Clock();resize3D();window.addEventListener("resize",resize3D);animateScene()
}
function resize3D(){if(!renderer)return;const r=$("sceneCanvas").getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
function animateScene(){
 const t=clock.getElapsedTime();
 trees.forEach((o,i)=>{o.g.rotation.z=Math.sin(t*.9+o.phase)*.025; o.g.rotation.x=Math.cos(t*.7+o.phase)*.012});
 if(waterTex){waterTex.offset.y=-t*.8;waterTex.offset.x=Math.sin(t*.35)*.04}
 if(squirrel){
   squirrel.userData.tail.rotation.z=.35+Math.sin(t*5)*.24;
   squirrel.userData.limbs.forEach((l,i)=>l.rotation.x=Math.sin(t*8+i*Math.PI/2)*.45);
   if(runActive){runT+=.012; squirrel.position.x=-6+12*runT; squirrel.position.y=-.75+Math.abs(Math.sin(runT*Math.PI*8))*.22; if(runT>=1){runActive=false;runT=0;squirrel.position.x=-6}}
 }
 renderer.render(scene,camera);requestAnimationFrame(animateScene)
}
function syncDiceOrientation(){if(!THREE)return;state.dice.forEach((v,i)=>{diceMeshes[i].quaternion.copy(resultQuaternion(v));diceMeshes[i].position.y=.35})}
async function animateRoll(next){
 if(!THREE||animating)return;animating=true;render();
 const start=performance.now(),dur=950,starts=diceMeshes.map(m=>m.quaternion.clone()),ends=next.map(resultQuaternion);
 await new Promise(resolve=>{
  function frame(now){
   const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);
   diceMeshes.forEach((m,i)=>{
    if(state.held[i])return;
    const spin=new THREE.Quaternion().setFromEuler(new THREE.Euler((4+i)*Math.PI*2*e,(5+i%3)*Math.PI*2*e,(3+i%2)*Math.PI*2*e));
    const q=starts[i].clone().multiply(spin);if(t>.72)q.slerp(ends[i],(t-.72)/.28);m.quaternion.copy(q);m.position.y=.35+Math.sin(Math.PI*t)*1.6
   });
   if(t<1)requestAnimationFrame(frame);else{diceMeshes.forEach((m,i)=>{m.quaternion.copy(ends[i]);m.position.y=.35});resolve()}
  } requestAnimationFrame(frame)
 });
 animating=false;render()
}
function scoreRow(label,k){
 const r=document.createElement("div"),used=state.scores[state.turn][k]!==undefined,avail=canAct()&&state.rolls>0&&!used;
 r.className="sr"+(avail?" available":"")+(used?" used":"");
 const b=document.createElement("button");b.type="button";b.textContent=label;b.disabled=!avail;b.addEventListener("click",()=>choose(k,label));
 const v=document.createElement("div");v.className="v";v.textContent=used?state.scores[state.turn][k]:(avail?scoreFor(k):"—");r.append(b,v);return r
}
function render(){
 $("upperRows").innerHTML="";$("lowerRows").innerHTML="";upper.forEach(x=>$("upperRows").appendChild(scoreRow(...x)));lower.forEach(x=>$("lowerRows").appendChild(scoreRow(...x)));
 $("upperTotal").textContent=upTotal(state.turn);$("grandTotal").textContent=total(state.turn);$("youScore").textContent=total(0);$("friendScore").textContent=total(1);
 $("roomLabel").textContent="Room: "+state.room;$("turnLabel").textContent=state.started?state.players[state.turn]+"'s Turn":"Start Game";
 $("rollBtn").disabled=!canAct()||state.rolls>=3||animating;$("raidBtn").disabled=!state.started;$("rollSub").textContent=(3-state.rolls)+" ROLLS LEFT";
 const rv=$("rollValues");rv.innerHTML="";state.dice.forEach(v=>{const d=document.createElement("div");d.textContent="TOP = "+v;rv.appendChild(d)});
 const h=$("holds");h.innerHTML="";state.dice.forEach((v,i)=>{const b=document.createElement("button");b.textContent=state.held[i]?"🔒 HELD":"🔒 HOLD";b.className=state.held[i]?"held":"";b.disabled=!canAct()||state.rolls===0||animating;b.addEventListener("click",()=>{state.held[i]=!state.held[i];render();sync()});h.appendChild(b)})
}
function sync(){if(mode==="online"&&conn&&conn.open)conn.send({type:"state",state})}
async function roll(){
 if(!canAct()||state.rolls>=3||animating)return;
 const next=state.dice.map((d,i)=>state.held[i]?d:1+Math.floor(Math.random()*6));state.dice=next;state.rolls++;render();await animateRoll(next);render();
 if(state.dice.every(x=>x===state.dice[0]))toast("🌰 YAHTZEE! ACORN JACKPOT! 🐿️");else if(Math.random()<.35)runSquirrel();
 sync()
}
function choose(k,label){
 if(!canAct()||state.rolls===0||state.scores[state.turn][k]!==undefined)return;
 const pts=scoreFor(k);state.scores[state.turn][k]=pts;if(pts>=40)toast(label+"!");
 const done=all.every(([,x])=>state.scores[0][x]!==undefined)&&all.every(([,x])=>state.scores[1][x]!==undefined);
 if(done){state.started=false;const a=total(0),b=total(1);toast(a===b?"WOODLAND TIE!":state.players[a>b?0:1]+" WINS!")}
 else{state.turn=1-state.turn;state.rolls=0;state.held=[false,false,false,false,false]}
 render();sync()
}
function runSquirrel(){if(!squirrel)return;runActive=true;runT=0}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");runSquirrel();setTimeout(()=>$("toast").classList.remove("show"),2000)}
function startLocal(){mode="local";state=blank();state.players=[$("name").value.trim()||"Player 1","Player 2"];state.started=true;state.room="LOCAL";$("status").textContent="Pass & Play mode.";render();syncDiceOrientation()}
function reset(){const names=[...state.players],room=state.room;state=blank();state.players=names;state.room=room;state.started=mode!=="none";render();syncDiceOrientation();sync()}
function code(){return "NUT-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function setupConn(){conn.on("data",m=>{if(m.type==="join"&&myIndex===0){state.players[1]=m.name||"Friend";render();sync()}if(m.type==="hello"&&myIndex===1){state=m.state;state.players[1]=$("name").value.trim()||"Friend";render();syncDiceOrientation();sync()}if(m.type==="state"){state=m.state;render();syncDiceOrientation()}});conn.on("close",()=>$("status").textContent="Connection closed.")}
function host(){if(typeof Peer==="undefined"){$("status").textContent="Online library failed.";return}mode="online";myIndex=0;const c=code();state.room=c;$("roomInput").value=c;peer=new Peer(c);peer.on("open",()=>$("status").textContent=`Room ${c} ready.`);peer.on("connection",x=>{conn=x;setupConn();conn.on("open",()=>{state=blank();state.players=[$("name").value.trim()||"Player 1","Friend"];state.room=c;state.started=true;conn.send({type:"hello",state});$("status").textContent="Friend connected.";render();syncDiceOrientation();sync()})})}
function join(){if(typeof Peer==="undefined"){$("status").textContent="Online library failed.";return}const c=$("roomInput").value.trim().toUpperCase();if(!c)return;mode="online";myIndex=1;peer=new Peer();peer.on("open",()=>{conn=peer.connect(c,{reliable:true});setupConn();conn.on("open",()=>{state.room=c;$("status").textContent="Connected.";conn.send({type:"join",name:$("name").value.trim()||"Friend"})})})}

$("localBtn").addEventListener("click",startLocal);$("hostBtn").addEventListener("click",host);$("joinBtn").addEventListener("click",join);$("rollBtn").addEventListener("click",roll);$("raidBtn").addEventListener("click",()=>{runSquirrel();toast("🐿️ ACORN RAID!")});$("newBtn").addEventListener("click",reset);
init3D().then(()=>{render();syncDiceOrientation()}).catch(e=>{$("status").textContent="3D renderer failed: "+e.message});
</script>
</body></html>
