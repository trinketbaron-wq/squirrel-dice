<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--wood:#5b341c;--wood2:#342012;--cream:#efd0a0;--ink:#2c190c;--green:#24a443;--gold:#e9bd65}
*{box-sizing:border-box}
html,body{margin:0;background:#08150e;color:white;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
button,input{font:inherit} button{touch-action:manipulation}
#app{max-width:760px;margin:auto;padding:5px;background:linear-gradient(#10271a,#07130d)}
.top{display:grid;grid-template-columns:1.15fr .8fr 1fr;gap:4px;align-items:center}
.brand{height:60px;border-radius:13px;padding:7px 9px;display:flex;align-items:center;gap:5px;
 background:linear-gradient(145deg,#7b4a27,#4c2c18);border:1px solid #ffffff22;box-shadow:0 5px 13px #0007}
.brand img{width:38px;height:38px;object-fit:contain} .brand b{font-size:12px;line-height:1.02} .brand small{font-size:7px;color:#f5d9aa;font-weight:900}
.room{background:#26342f;border-radius:12px;text-align:center;padding:6px 3px;font-size:10px;font-weight:900}
.room .turn{display:block;color:#63ff72;margin-top:2px}
.players{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.player{border:2px solid #52d96a;background:#154928;border-radius:11px;text-align:center;padding:2px;font-size:8px}
.player.friend{background:#173c63;border-color:#48a6ff} .player img{width:23px;height:23px;object-fit:contain;vertical-align:middle} .player strong{font-size:12px}
.connect{margin-top:4px;background:#111b16;padding:4px;border-radius:10px;display:grid;grid-template-columns:1fr auto auto;gap:3px}
.connect input{min-width:0;background:#0a1710;border:1px solid #ffffff1c;color:white;border-radius:7px;padding:5px;font-size:11px}
.connect button{border:0;border-radius:7px;padding:5px 7px;background:#e1bd6c;color:#2c1e0d;font-size:9px;font-weight:900}
.connect .alt{background:#d8e8d8}

.scene-title{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:9px;font-weight:1000;text-shadow:0 2px 3px #000}
.table{position:relative;height:250px;background:
 radial-gradient(ellipse at 50% 48%,#a66b3b 0 35%,#754522 58%,#4a2917 78%,#2f1a0f 100%);
 box-shadow:inset 0 10px 18px #0005}
.table:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;
 background:repeating-radial-gradient(ellipse at 48% 50%,transparent 0 22px,#241309 24px 25px,transparent 27px 42px)}
#diceCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2}
.holds{position:absolute;z-index:4;left:3%;right:3%;bottom:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.holds button{border:1px solid #776b5c;border-radius:8px;background:#211e1a;color:white;padding:4px 1px;font-size:8px;font-weight:900}
.holds button.held{background:#3e5b34;color:#ffe9a1;border-color:#d6b65d}
.score{margin-top:4px;border:3px solid #744221;border-radius:15px;background:linear-gradient(#e9c994,#d8aa70);padding:4px;color:var(--ink)}
.sections{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.sec{border:1px solid #986e49;border-radius:8px;overflow:hidden;background:#efd2a5}
.sh,.sr,.tot{display:grid;grid-template-columns:1fr 42px}
.sh{background:#754220;color:#ffe9c6;font-size:8px;font-weight:1000;padding:3px 4px}
.sr{min-height:19px;border-top:1px solid #b98f67} .sr button{border:0;background:transparent;text-align:left;color:#321d0d;font-size:8px;padding:1px 4px} .sr .v{display:grid;place-items:center;border-left:1px solid #b98f67;font-size:8px;font-weight:900}
.sr.avail{background:#d6e7bd} .tot{background:#ca9961;padding:3px 4px;font-size:8px;font-weight:1000} .tot span:last-child{text-align:center}
.rollbar{display:grid;grid-template-columns:1fr 62px;gap:4px;margin-top:4px}
.roll{min-height:48px;border:0;border-radius:13px;background:linear-gradient(#4fba5b,#187e2c);color:white;font-size:18px;font-weight:1000;text-shadow:0 2px 2px #0005;box-shadow:0 4px 0 #0b5519}
.roll small{display:block;font-size:9px} .roll:disabled{opacity:.5;box-shadow:none}
.raid{border:0;border-radius:11px;background:#2c2017;color:#ffe8ba;font-size:8px;font-weight:900}
.info{margin-top:4px;background:#17130f;border-radius:9px;padding:5px 6px;display:flex;justify-content:space-between;gap:4px;font-size:8px;color:#ead7ba}
.info button{border:1px solid #5a554f;background:#2b2926;color:#ddd;border-radius:7px;font-size:8px}
.runnerWrap{position:fixed;z-index:1000;left:-140px;bottom:20px;width:120px;height:120px;pointer-events:none}

<script type="module">
const upper=[["Ones","ones"],["Twos","twos"],["Threes","threes"],["Fours","fours"],["Fives","fives"],["Sixes","sixes"]];
const lower=[["3 of a Kind","three"],["4 of a Kind","four"],["Full House","full"],["Small Straight","small"],["Large Straight","large"],["Yahtzee","yahtzee"],["Chance","chance"]];
const all=[...upper,...lower], $=id=>document.getElementById(id);
const blank=()=>({players:["Player 1","Player 2"],turn:0,rolls:0,dice:[1,1,1,1,1],held:[false,false,false,false,false],scores:[{},{}],started:false,room:"—"});
let state=blank(),mode="none",myIndex=0,peer=null,conn=null;
let THREE,renderer,scene,camera,diceMeshes=[],animating=false;

function canAct(){return state.started&&(mode==="local"||(mode==="online"&&state.turn===myIndex&&conn&&conn.open))}
function counts(){const c=[0,0,0,0,0,0,0];state.dice.forEach(d=>c[d]++);return c}
function scoreFor(k){const c=counts(),sum=state.dice.reduce((a,b)=>a+b,0),u=[...new Set(state.dice)].sort((a,b)=>a-b).join(""),up=["ones","twos","threes","fours","fives","sixes"];if(up.includes(k)){const n=up.indexOf(k)+1;return c[n]*n}if(k==="three")return c.some(x=>x>=3)?sum:0;if(k==="four")return c.some(x=>x>=4)?sum:0;if(k==="full")return c.includes(3)&&c.includes(2)?25:0;if(k==="small")return /1234|2345|3456/.test(u)?30:0;if(k==="large")return u==="12345"||u==="23456"?40:0;if(k==="yahtzee")return c.includes(5)?50:0;return sum}
function total(p){return Object.values(state.scores[p]).reduce((a,b)=>a+b,0)} function upTotal(p){return upper.reduce((s,[,k])=>s+(state.scores[p][k]||0),0)}

function makePipTexture(value){
 const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");
 x.fillStyle="#fffaf0";x.fillRect(0,0,256,256);
 const pos={1:[[128,128]],2:[[70,70],[186,186]],3:[[70,70],[128,128],[186,186]],4:[[70,70],[186,70],[70,186],[186,186]],5:[[70,70],[186,70],[128,128],[70,186],[186,186]],6:[[70,58],[186,58],[70,128],[186,128],[70,198],[186,198]]}[value];
 x.fillStyle="#16120e";for(const [px,py] of pos){x.beginPath();x.arc(px,py,22,0,Math.PI*2);x.fill()}
 const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t
}
function resultQuaternion(v){
 const q=new THREE.Quaternion(), axis=new THREE.Vector3(1,0,0);
 if(v===1) return q;
 if(v===6) return q.setFromAxisAngle(axis,Math.PI);
 if(v===2) return q.setFromAxisAngle(axis,-Math.PI/2);
 if(v===5) return q.setFromAxisAngle(axis,Math.PI/2);
 if(v===3) return q.setFromAxisAngle(new THREE.Vector3(0,0,1),Math.PI/2);
 return q.setFromAxisAngle(new THREE.Vector3(0,0,1),-Math.PI/2)
}
async function init3D(){
 THREE=await import("https://cdn.jsdelivr.net/npm/three@0.168.0/+esm");
 const {RoundedBoxGeometry}=await import("https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm");
 const canvas=$("diceCanvas");
 renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene=new THREE.Scene();
 camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.set(0,5.8,10.5);camera.lookAt(0,0.4,0);
 const amb=new THREE.HemisphereLight(0xfff2d5,0x4b2d18,2.2);scene.add(amb);
 const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(-3,7,5);key.castShadow=true;scene.add(key);
 const rim=new THREE.DirectionalLight(0xffc36a,1.5);rim.position.set(5,3,-3);scene.add(rim);
 const plane=new THREE.Mesh(new THREE.CircleGeometry(6.7,64),new THREE.MeshStandardMaterial({color:0x82502b,roughness:.9,metalness:0}));plane.rotation.x=-Math.PI/2;plane.position.y=-1.05;plane.receiveShadow=true;scene.add(plane);
 const mats=[3,4,1,6,2,5].map(v=>new THREE.MeshStandardMaterial({map:makePipTexture(v),roughness:.28,metalness:.02}));
 for(let i=0;i<5;i++){
   const mesh=new THREE.Mesh(new RoundedBoxGeometry(1.42,1.42,1.42,8,.18),mats);
   mesh.castShadow=true;mesh.receiveShadow=true;mesh.position.set((i-2)*1.72,0,0);scene.add(mesh);diceMeshes.push(mesh)
 }
 resize3D();window.addEventListener("resize",resize3D);render3D();
}
function resize3D(){
 if(!renderer)return;const r=$("diceCanvas").getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()
}
function render3D(){renderer.render(scene,camera);requestAnimationFrame(render3D)}
function animateRoll(oldVals,newVals){
 if(!THREE||animating)return Promise.resolve();animating=true;
 const start=performance.now(),dur=900;
 const starts=diceMeshes.map(m=>m.quaternion.clone()), ends=newVals.map(resultQuaternion);
 const spins=diceMeshes.map((m,i)=>new THREE.Vector3((3+i%2)*Math.PI*2,(4+(i%3))*Math.PI*2,(2+i%2)*Math.PI*2));
 return new Promise(resolve=>{
  function frame(now){
    const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);
    diceMeshes.forEach((m,i)=>{
      if(state.held[i]) return;
      const base=starts[i].clone();
      const spinQ=new THREE.Quaternion().setFromEuler(new THREE.Euler(spins[i].x*e,spins[i].y*e,spins[i].z*e));
      const q=base.clone().multiply(spinQ);
      if(t>.72) q.slerp(ends[i],(t-.72)/.28);
      m.quaternion.copy(q);
      m.position.y=Math.sin(Math.PI*t)*1.4;
    });
    if(t<1)requestAnimationFrame(frame);else{diceMeshes.forEach((m,i)=>{m.position.y=0;m.quaternion.copy(ends[i])});animating=false;resolve()}
  }
  requestAnimationFrame(frame)
 })
}
function syncDiceOrientation(){if(!THREE)return;state.dice.forEach((v,i)=>diceMeshes[i].quaternion.copy(resultQuaternion(v)))}

function row(label,k){const r=document.createElement("div");r.className="sr";const used=state.scores[state.turn][k]!==undefined;if(!used&&state.rolls>0&&canAct())r.classList.add("avail");const b=document.createElement("button");b.textContent=label;b.disabled=!canAct()||state.rolls===0||used;b.addEventListener("click",()=>choose(k,label));const v=document.createElement("div");v.className="v";v.textContent=used?state.scores[state.turn][k]:((state.rolls>0&&canAct())?scoreFor(k):"—");r.append(b,v);return r}
function render(){
 $("upperRows").innerHTML="";$("lowerRows").innerHTML="";upper.forEach(x=>$("upperRows").appendChild(row(...x)));lower.forEach(x=>$("lowerRows").appendChild(row(...x)));
 $("upperTotal").textContent=upTotal(state.turn);$("grandTotal").textContent=total(state.turn);$("youScore").textContent=total(0);$("friendScore").textContent=total(1);
 $("roomLabel").textContent="Room: "+state.room;$("turnLabel").textContent=state.started?state.players[state.turn]+"'s Turn":"Start Game";$("rollBtn").disabled=!canAct()||state.rolls>=3||animating;$("raidBtn").disabled=!state.started;$("rollSub").textContent=(3-state.rolls)+" ROLLS LEFT";
 const h=$("holds");h.innerHTML="";state.dice.forEach((v,i)=>{const b=document.createElement("button");b.textContent=state.held[i]?"🔒 HELD":"🔒 HOLD";b.className=state.held[i]?"held":"";b.disabled=!canAct()||state.rolls===0||animating;b.addEventListener("click",()=>{state.held[i]=!state.held[i];render();sync()});h.appendChild(b)})
}
function sync(){if(mode==="online"&&conn&&conn.open)conn.send({type:"state",state})}
async function roll(){
 if(!canAct()||state.rolls>=3||animating)return;const old=[...state.dice], next=state.dice.map((d,i)=>state.held[i]?d:1+Math.floor(Math.random()*6));state.dice=next;state.rolls++;render();await animateRoll(old,next);render();if(state.dice.every(x=>x===state.dice[0]))celebrate("🌰 YAHTZEE! ACORN JACKPOT! 🐿️");else if(Math.random()<.3)runSquirrel();sync()
}
function choose(k,label){if(!canAct()||state.rolls===0||state.scores[state.turn][k]!==undefined)return;const pts=scoreFor(k);state.scores[state.turn][k]=pts;if(pts>=40)celebrate(label+"!");state.turn=1-state.turn;state.rolls=0;state.held=[false,false,false,false,false];render();sync()}
function runSquirrel(){const r=$("runnerWrap");r.classList.remove("go");void r.offsetWidth;r.classList.add("go")}
function celebrate(text){$("toast").textContent=text;$("toast").classList.add("show");$("celebrate").classList.remove("show");void $("celebrate").offsetWidth;$("celebrate").classList.add("show");setTimeout(()=>{$("toast").classList.remove("show");$("celebrate").classList.remove("show")},2100)}
function startLocal(){mode="local";state=blank();state.players=[$("name").value.trim()||"Player 1","Player 2"];state.started=true;state.room="LOCAL";$("status").textContent="Pass & Play mode.";render();syncDiceOrientation()}
function reset(){const names=[...state.players],room=state.room;state=blank();state.players=names;state.room=room;state.started=mode!=="none";render();syncDiceOrientation();sync()}
function code(){return "NUT-"+Math.random().toString(36).slice(2,7).toUpperCase()}
function setupConn(){conn.on("data",m=>{if(m.type==="join"&&myIndex===0){state.players[1]=m.name||"Friend";render();sync()}if(m.type==="hello"&&myIndex===1){state=m.state;state.players[1]=$("name").value.trim()||"Friend";render();syncDiceOrientation();sync()}if(m.type==="state"){state=m.state;render();syncDiceOrientation()}});conn.on("close",()=>$("status").textContent="Connection closed.")}
function host(){if(typeof Peer==="undefined"){$("status").textContent="Online library failed.";return}mode="online";myIndex=0;const c=code();state.room=c;$("roomInput").value=c;peer=new Peer(c);peer.on("open",()=>$("status").textContent=`Room ${c} ready.`);peer.on("connection",x=>{conn=x;setupConn();conn.on("open",()=>{state=blank();state.players=[$("name").value.trim()||"Player 1","Friend"];state.room=c;state.started=true;conn.send({type:"hello",state});$("status").textContent="Friend connected.";render();syncDiceOrientation();sync()})})}
function join(){if(typeof Peer==="undefined"){$("status").textContent="Online library failed.";return}const c=$("roomInput").value.trim().toUpperCase();if(!c)return;mode="online";myIndex=1;peer=new Peer();peer.on("open",()=>{conn=peer.connect(c,{reliable:true});setupConn();conn.on("open",()=>{state.room=c;$("status").textContent="Connected.";conn.send({type:"join",name:$("name").value.trim()||"Friend"})})})}
$("localBtn").addEventListener("click",startLocal);$("hostBtn").addEventListener("click",host);$("joinBtn").addEventListener("click",join);$("rollBtn").addEventListener("click",roll);$("raidBtn").addEventListener("click",()=>{runSquirrel();celebrate("🐿️ ACORN RAID!")});$("newBtn").addEventListener("click",reset);
init3D().then(()=>{render();syncDiceOrientation()}).catch(e=>{$("status").textContent="3D renderer failed to load: "+e.message});
</script>
</body></html>
